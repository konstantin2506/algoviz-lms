name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon

      - name: Upload test report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: algoviz-jar
          path: build/libs/*.jar

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: algoviz-lms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test (run app, hit API)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Start app
        run: |
          chmod +x gradlew
          ./gradlew bootRun --no-daemon &
          # ждём до 60 секунд, пока приложение не ответит
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/visualize/vector/algorithms > /dev/null 2>&1; then
              echo "App is up!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 1
          done

      - name: Smoke - algorithms list
        run: |
          curl -f http://localhost:8080/api/visualize/vector/algorithms
          curl -s http://localhost:8080/api/visualize/vector/algorithms | grep -q "bubbleSort"

      - name: Smoke - bubble sort works
        run: |
          response=$(curl -s -X POST http://localhost:8080/api/visualize/vector/bubbleSort \
            -H "Content-Type: application/json" \
            -d '{"data":[5,2,9,1,8,3,6]}')
          echo "$response" | head -c 300
          echo "$response" | grep -q '"dataStructure"'
          echo "$response" | grep -q '"steps"'

      - name: Stop app
        if: always()
        run: pkill -f "bootRun" || true